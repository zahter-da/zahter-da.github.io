<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Full menu with Syrian dishes, vegan options, chicken, meat, pizza, burgers and drinks." />
  <title data-i18n="meta.menuTitle">Menu | Zatar Restaurant</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
  <header class="site-header">
    <nav class="navbar container" aria-label="Main navigation">
      <a href="index.html" class="brand"><span class="brand-mark">ز</span><span>Zatar</span></a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu"><span></span><span></span><span></span></button>
      <div id="nav-menu" class="nav-menu">
        <a href="index.html" data-i18n="nav.home">Home</a>
        <a href="menu.html" data-i18n="nav.menu">Menu</a>
        <a href="index.html#contact" data-i18n="nav.contact">Contact</a>
        <a href="impressum.html" data-i18n="nav.impressum">Impressum</a>
        <a href="datenschutz.html" data-i18n="nav.privacy">Privacy</a>
        <select id="language-select" class="language-select" aria-label="Choose language">
          <option value="de">DE</option><option value="en">EN</option><option value="ar">AR</option>
        </select>
      </div>
    </nav>
  </header>

  <main id="main">
    <section class="page-hero pattern-bg">
      <div class="container reveal">
        <p class="eyebrow" data-i18n="menu.eyebrow">Full menu</p>
        <h1 data-i18n="menu.title">Explore our menu</h1>
        <p data-i18n="menu.subtitle">Filter Syrian dishes, pizza, burgers and drinks by preference or allergy information.</p>
      </div>
    </section>

    <section class="section container">
      <div class="filters reveal" aria-label="Menu filters">
        <button class="filter-btn active" data-filter="all" data-i18n="filter.all">All</button>
        <button class="filter-btn" data-filter="vegan" data-i18n="filter.vegan">Vegan</button>
        <button class="filter-btn" data-filter="chicken" data-i18n="filter.chicken">Chicken</button>
        <button class="filter-btn" data-filter="meat" data-i18n="filter.meat">Meat</button>
        <button class="filter-btn" data-filter="allergy" data-i18n="filter.allergy">Allergy filters</button>
        <button class="filter-btn" data-filter="pizza" data-i18n="filter.pizza">Pizza</button>
        <button class="filter-btn" data-filter="burger" data-i18n="filter.burger">Burger</button>
        <button class="filter-btn" data-filter="drinks" data-i18n="filter.drinks">Drinks</button>
      </div>

      <div id="menu-status" class="menu-status" aria-live="polite"></div>
      <div id="menu-grid" class="menu-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <p>© <span id="year"></span> Zatar Restaurant</p>
      <div><a href="impressum.html" data-i18n="nav.impressum">Impressum</a><a href="datenschutz.html" data-i18n="nav.privacy">Privacy</a></div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
